appId: com.anemone221.mco
productName: MCO
copyright: Copyright © 2026 Anemone221

directories:
  output: release
  buildResources: build

# Where `electron-builder --publish` uploads to, and where the in-app update
# check looks (src/main/services/updateService.ts reads this repo's latest
# release). `releaseType: draft` means a published build is never announced
# before its notes are written: /releases/latest ignores drafts, so the app
# stays quiet until the release is actually published.
publish:
  provider: github
  owner: Anemone221
  repo: MCO
  releaseType: draft

# better-sqlite3 ships a native .node binary that cannot be loaded from inside
# an asar archive, so it must be unpacked.
# resources/ (window + tray icons) is also unpacked so nativeImage loads them
# from a real file on disk — window icons are not reliably read from inside asar.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - 'resources/**'

files:
  - out/**/*
  - resources/**/*
  - package.json

# App icons live in the buildResources dir (build/): icon.ico for Windows,
# icon.png (1024x1024) for macOS/Linux — electron-builder generates the .icns
# and Linux icon set from it. Regenerate from Clonebay_1024.png; see docs/development.md.
win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh

mac:
  category: public.app-category.utilities
  target:
    # Both architectures from one (arm64) runner: electron-builder rebuilds
    # better-sqlite3 per arch, so Intel Macs are not left without a build.
    - target: dmg
      arch:
        - x64
        - arm64
  # An ad-hoc signature, not a Developer ID one — MCO has no signing identity
  # yet (see docs/development.md). It is not optional on Apple silicon: macOS
  # refuses to run an unsigned arm64 binary at all. Set explicitly rather than
  # left to electron-builder's fallback, because `identity: null` would skip
  # signing entirely and produce an arm64 app that cannot launch.
  #
  # Ad-hoc is not notarized, so a downloaded build is still quarantined and the
  # first launch needs `xattr -c /Applications/MCO.app` — the README says so.
  identity: '-'
  notarize: false

dmg:
  # Always arch-suffixed. Without a pattern electron-builder drops the suffix
  # for the default arch, which would ship two DMGs whose names don't say which
  # Mac they're for.
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Utility
