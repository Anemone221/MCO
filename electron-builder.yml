appId: com.anemone221.mco
productName: MCO
copyright: Copyright © 2026 Anemone221

directories:
  output: release
  buildResources: build

# better-sqlite3 ships a native .node binary that cannot be loaded from inside
# an asar archive, so it must be unpacked.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

files:
  - out/**/*
  - resources/**/*
  - package.json

# App icons live in the buildResources dir (build/): icon.ico for Windows,
# icon.png (1024x1024) for macOS/Linux — electron-builder generates the .icns
# and Linux icon set from it. Regenerate from Clonebay.png; see docs/development.md.
win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh

mac:
  target:
    - dmg
  category: public.app-category.utilities

linux:
  target:
    - AppImage
  category: Utility
