appId: com.anemone221.mco
productName: MCO
copyright: Copyright © 2026 Anemone221

directories:
  output: release
  buildResources: build

# better-sqlite3 ships a native .node binary that cannot be loaded from inside
# an asar archive, so it must be unpacked.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

files:
  - out/**/*
  - package.json

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.utilities

linux:
  target:
    - AppImage
  category: Utility
