name: Release

# Publishing a release is what the in-app update check looks for: it reads the
# repository's *latest* release and compares its tag against the running build's
# version (see src/main/services/updateService.ts). So the tag must match
# package.json's version — the guard below refuses the run if it doesn't, since
# a mismatch would either never notify anyone or notify them of nothing.
#
# To cut a release:
#   1. bump "version" in package.json (and commit it)
#   2. git tag v0.3.0 && git push origin v0.3.0
#
# Shape: every platform *builds* (publishing nothing), then one job uploads the
# lot into a single draft release. electron-builder's own `--publish always`
# cannot be used per-platform here — two builders racing to create the same
# release leave two half-filled drafts, and a builder that finds a release it
# considers incompatible logs "skipped publishing" and still exits 0. That is
# how v0.3.0 shipped with no DMGs attached. Building and publishing separately
# means one writer, one release, and a verification step that actually fails.
on:
  push:
    tags: ['v*']
  # Re-run against an existing tag if a build failed after the tag was pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.3.0)'
        required: true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
            # NSIS installer, its blockmap, and the updater's feed file.
            artifacts: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: macos-latest
            # DMG for x64 + arm64 (see electron-builder.yml).
            platform: --mac
            artifacts: |
              release/*.dmg
              release/*.blockmap
              release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match package.json ($version)." >&2
            echo "Bump the version, commit, then re-tag." >&2
            exit 1
          fi
          echo "Releasing $tag."

      # The same gates as CI. A release is the one build users actually install,
      # so it does not skip them for being slower.
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Package
        # `--publish never`: the upload is the next job's job. The updater feed
        # files (latest.yml / latest-mac.yml) are still written, because
        # electron-builder generates those from the publish *config*, not from
        # whether it uploaded anything.
        run: npx electron-vite build && npx electron-builder ${{ matrix.platform }} --publish never
        env:
          # No Developer ID certificate, and none wanted: `mac.identity` pins an
          # ad-hoc signature, so keychain discovery has nothing to find and only
          # slows the build down with a warning.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build to the workflow
        uses: actions/upload-artifact@v4
        with:
          name: mco-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          # A leg that produced no installer is a failed leg, not an empty one.
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading assets to it.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Collect every platform's build
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Names, not counts: an arch that silently stopped building would still
      # leave "some DMGs" behind. Runs before the upload so a short release is
      # never created in the first place.
      - name: Check the release is complete
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          missing=0
          for file in \
            "MCO-Setup-${version}.exe" \
            "MCO-${version}-x64.dmg" \
            "MCO-${version}-arm64.dmg" \
            "latest.yml" \
            "latest-mac.yml"
          do
            if [ ! -f "dist/$file" ]; then
              echo "Missing: $file" >&2
              missing=1
            fi
          done
          echo "Built:"
          ls -1sh dist
          [ "$missing" -eq 0 ] || { echo "Release is incomplete — not publishing." >&2; exit 1; }

      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          # A draft, so the notes can be written before anyone is told: the app's
          # check reads /releases/latest, which ignores drafts and prereleases.
          # **A draft release updates nobody** — publishing it is what ships.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — uploading into it."
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --draft --title "$tag" --generate-notes
          fi

      # electron-builder used to warn and exit 0 when it could not upload. This
      # is the check that would have caught that: ask GitHub what is actually
      # attached to the release, and fail if the answer is short.
      - name: Check the assets actually landed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          attached="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          echo "Attached to $tag:"
          echo "$attached" | sed 's/^/  /'
          missing=0
          for file in \
            "MCO-Setup-${version}.exe" \
            "MCO-${version}-x64.dmg" \
            "MCO-${version}-arm64.dmg" \
            "latest.yml" \
            "latest-mac.yml"
          do
            echo "$attached" | grep -qx "$file" || { echo "Not attached: $file" >&2; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
