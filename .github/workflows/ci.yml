name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test

      - name: E2E tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: npx playwright test

  # Exercises electron-builder on every push, on the two platforms that ship
  # builds: the NSIS installer and the DMG. Linux's AppImage is configured but
  # not published, so it stays out — packaging runs are slow.
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # electron-builder downloads the Electron dist and its winCodeSign
      # toolchain on first run; cached, the job is mostly just build time.
      # Both platforms' cache locations are listed — the ones that don't exist
      # on this runner are simply skipped.
      - name: Cache electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm ci

      # `electron-builder --dir` (no installer — fast) followed by a smoke test
      # of the real binary. Packaging alone only proves the config parses; the
      # smoke test proves the package actually runs. On macOS that also proves
      # the ad-hoc signature holds — an arm64 app that failed to sign would not
      # launch at all.
      - name: Package (unpacked) and smoke-test
        run: npm run test:packaged
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Windows only, and not on PRs: ~250 MB per run, and the smoke test above
      # is the signal on both platforms.
      - name: Upload unpacked build
        if: github.event_name == 'push' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: mco-win-unpacked
          path: release/win-unpacked
          retention-days: 7
