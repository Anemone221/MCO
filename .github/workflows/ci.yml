name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: E2E tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test

      - name: E2E tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: npx playwright test

  # Exercises electron-builder on every push. Windows only: it's the primary
  # distribution target, and packaging runs are slow enough that one platform
  # is the right trade — add macos/ubuntu here if those builds start shipping.
  package:
    name: package (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # electron-builder downloads the Electron dist and its winCodeSign
      # toolchain on first run; cached, the job is mostly just build time.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm ci

      # `electron-builder --dir` (no installer — fast) followed by a smoke test
      # of the real binary. Packaging alone only proves the config parses; the
      # smoke test proves the package actually runs.
      - name: Package (unpacked) and smoke-test
        run: npm run test:packaged

      # Not on PRs: ~250 MB per run, and the smoke test above is the signal.
      - name: Upload unpacked build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mco-win-unpacked
          path: release/win-unpacked
          retention-days: 7
